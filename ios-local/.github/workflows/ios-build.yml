name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
      
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: Clean build folder
      run: |
        cd UTEDeadlineLocal.xcodeproj/..
        xcodebuild clean -project UTEDeadlineLocal.xcodeproj -scheme UTEDeadlineLocal
    
    - name: Build iOS app
      run: |
        xcodebuild -project UTEDeadlineLocal.xcodeproj \
          -scheme UTEDeadlineLocal \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath ./build \
          -allowProvisioningUpdates \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Create IPA (Optional)
      continue-on-error: true
      run: |
        mkdir -p ./output
        # Tìm file .app và tạo thư mục Payload
        APP_PATH=$(find ./build -name "*.app" | head -n 1)
        if [ -n "$APP_PATH" ]; then
          mkdir -p ./output/Payload
          cp -R "$APP_PATH" ./output/Payload/
          cd ./output
          zip -r UTEDeadlineLocal.ipa Payload
          cd ..
          echo "IPA created successfully"
        else
          echo "No .app file found"
        fi
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-build
        path: |
          ./build/Build/Products/Release-iphoneos/
          ./output/*.ipa
        retention-days: 30
        if-no-files-found: warn
